# ---- executable predicate: run verbatim by the verify stage ----
verify:
  - mvn -q -f backend/shared-library test -Dgroups=ET-PLT-015 -DfailIfNoTests=false
  - mvn -q -f backend verify -Dgroups=ET-PLT-015 -DfailIfNoTests=false

risks:
  - "A workflow that reads the wall clock or a repository passes every unit test and fails on replay after a deploy; R3's lint and the replay test are the guard."
  - "Temporal's database becomes a checkout dependency once PurchaseWorkflow carries traffic; the shard count is chosen once, before the first production write."
  - "A signal is delivered at least once; a workflow that does not track originating ids applies a callback twice."
