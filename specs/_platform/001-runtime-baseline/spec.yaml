id: ET-PLT-001
title: Runtime baseline — the reactive contract, the clock, module boundaries
status: draft
area: PLT
service: all
subgraph: null
owner: lazarous
created: 2026-07-30
priority: must
wave: 0
blocked_by: []
conformance: "PDI Phase 1 project setup"
sources:
  - specs/CONVENTIONS.md
  - specs/ROADMAP.md
  - docs/PAYMENT_DATA_INTEGRITY_IMPLEMENTATION_PLAN.md
  - docs/architecture/NAMING_CONVENTIONS.md

# ---- the contract, mirrored from spec.md §4 so scripts need not parse markdown ----
persistence:
  collections: []
  indexes: []
  redis_keys: []

events:
  module: []
  bus: []
  topics: []

graphql:
  schema: null
  queries: []
  mutations: []

errors: []

beans:
  - platformClock              # Clock, Africa/Lusaka — the only source of time
  - reactiveJwtDecoder         # per service, from the Keycloak issuer URI
  - blockingScheduler          # boundedElastic, for infrastructure/ adapters only
  - jdbcTransactionManager     # @Primary, Modulith event publication (ET-PLT-003)
  - reactiveMongoTransactionManager  # the ticketing database (ET-PLT-002)

modules:
  catalog:  [event, tier, location, category, approval, reference]
  booking:  [reservation, ticket, payment, escrow, ledger, commission, payout, refund, reconciliation]
  identity: [user, organization, team, permission, document, notification, audit]

# ---- executable predicate: run verbatim by the verify stage ----
verify:
  - ./scripts/spec-lint.sh specs/_platform/001-runtime-baseline
  - ./scripts/spec-lint.sh --reactive
  - ./scripts/spec-lint.sh --clock
  - mvn -q -f backend -DskipTests clean install
  - mvn -q -f backend test -Dtest=ModuleStructureTest
  - mvn -q -f backend test -Dgroups=ET-PLT-001

risks:
  - "R1's BlockHound box will fail against any third-party library that blocks on a Netty thread without an obvious wrapper — the Keycloak Admin client and the AWS SDK v1 presigner are the two likely offenders. Each needs an infrastructure/ adapter before the agent can be turned on, so T2 may surface work that belongs to ET-IDN-002 and ET-ORG-001."
  - "R4 declares allowedDependencies per module. Any existing cross-module reference that the current package layout permits becomes a build failure the first time ModuleStructureTest runs, and the fix is sometimes a genuine design question rather than a move — booking's payment/escrow/ledger triangle in particular."
  - "R3 forbids inline now() platform-wide, but Spring Data's @CreatedDate and @LastModifiedDate populate from the system clock, not from the injected bean. Auditing annotations need a DateTimeProvider wired to the same Clock or the platform has two clocks and only one of them freezes in tests."
  - "R6 requires fail-fast on an absent variable, which conflicts with any service currently importing optional configuration. A service that starts without its Mongo URI and then fails on first query is strictly worse than one that refuses to start, but the change moves failures from runtime to deploy time and will surface misconfigured environments that presently appear healthy."
  - "The three subgraphs must resolve identical graphql-java versions (R2). DGS and Spring GraphQL both manage that coordinate, and a mismatch shows up as a scalar-coercion failure at composition rather than as a dependency error, which is a slow way to find it."
