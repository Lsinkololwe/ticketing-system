layers:
  - "1 decision     — plain JUnit, no infrastructure, hundreds of tests, ~1 ms"
  - "2 persistence  — @DataMongoTest + Mongo container, dozens, ~50 ms"
  - "3 saga         — fixture + stubs, one per saga, ~50 ms"
  - "4 contract     — rover over on-disk SDL, one per subgraph, ~1 s"
