risks:
  - "The registry allocates codes to capabilities that are not yet specified — every ticketing, payment and finance row is written against a spec that has not been authored. If those specs later find a condition the registry does not describe, they must edit this file, and a closed registry edited by seven downstream specs is a merge point the build order has to serialise."
  - "R6 makes a cross-tenant read indistinguishable from a missing resource, which means the tenant filter must run at the repository, before any existence check. A resolver that loads first and checks membership second returns NOT_FOUND correctly but has already read the other tenant's document into memory — and into any log line that dumps it."
  - "RESOURCE_CONFLICT is retryable and IDEMPOTENCY_KEY_REUSED is not, but both arrive as DuplicateKeyException. Distinguishing them requires reading which index was violated out of the driver's error, which is a string match against a Mongo error message — brittle, and wrong in the direction that tells a client to retry a duplicate payment."
  - "PAYMENT_DECLINED carries declineCategory, a platform enum mapped from the provider. PawaPay's decline vocabulary is not one-to-one with those five categories, so the mapping is lossy and OTHER will absorb the ambiguous cases. ET-PAY-001 owns that table; until it exists, the category is unpopulated."
  - "The catch-all handler returns retryable: true for INTERNAL_ERROR, which tells a mobile client to retry a mutation that may have partially applied. That is only safe for operations carrying an idempotency key, and nothing in this spec restricts INTERNAL_ERROR to those. A non-idempotent mutation failing internally and being retried is the double-charge this corpus exists to prevent."
  - "The enum-equals-registry test in T1 compares code names, not retryability or ErrorType. A row whose retryability is changed in prose but not in the enum passes, and the prose is what an implementer reads."
  - "GraphQL returns errors alongside partial data. A federated query where booking errors and catalog succeeds returns both, and a client reading data without checking errors sees a ticket list that is silently short. Nothing in this spec forces clients to check, and the frontend's generic handling is where that has to be enforced."
