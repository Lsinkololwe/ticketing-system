id: ET-PLT-002
title: Persistence baseline — replica set, the collection registry, money and time
status: draft
area: PLT
service: all
subgraph: null
owner: lazarous
created: 2026-07-30
priority: must
wave: 0
blocked_by: [ET-PLT-001]
