id: ET-NTF-002
title: Lifecycle triggers — which fact produces which message
status: approved
area: NTF
service: identity-service
subgraph: identity
owner: lazarous
created: 2026-07-30
priority: must
wave: 5
blocked_by: [ET-PLT-003, ET-NTF-001, ET-CAT-001, ET-TKT-002, ET-FIN-003, ET-FIN-004, ET-ORG-002]
conformance: "V3 §4 user journeys · V3 §9 rescheduling and cancellation notifications"
sources:
  - specs/CONVENTIONS.md
  - specs/ROADMAP.md
  - specs/_platform/003-event-contract/spec.md
  - specs/notification/001-notification-transport/spec.md
  - docs/ARCHITECTURE_REDESIGN_V3_COMPLETE.md

persistence:
  collections:
    - identity_event_reminders
    - identity_mass_sends          # ET-PLT-002 §4 registry row
  indexes:
    - "identity_event_reminders {status,scheduledFor} compound   # the dispatch sweep"
    - "identity_event_reminders {ticketId,reminderType} unique"
    - "identity_event_reminders {eventId} single                 # reschedule/cancel updates"
    - "identity_mass_sends {eventId,status} compound"
  redis_keys:
    - "notif:cap:{userId}   STRING  rolling PT1H  — optional-message counter"

events:
  module: []
  bus: []
  consumes:      # every row of the §4 registry
    - booking.TicketPurchased
    - booking.PaymentCompleted
    - booking.PaymentFailed
    - booking.TicketTransferred
    - booking.RefundCompleted
    - booking.PayoutCompleted
    - catalog.EventRescheduled
    - catalog.EventCancelled
    - identity.OrganizationApproved
    - identity.OrganizationSuspended
    - identity.MemberRoleChanged
    - identity.MemberRemoved
  topics: [booking-events, catalog-events, identity-events]

graphql:
  schema: backend/identity-service/src/main/resources/graphql/schema.graphqls
  queries:
    - "massSend(id)                  ORGANIZER      MassSend"
    - "massSendsForEvent(eventId)    ORGANIZER      [MassSend!]!"
    - "myUpcomingReminders           AUTHENTICATED  [EventReminder!]!"
    - "triggerRegistry               SUPER_ADMIN    [NotificationTrigger!]!  @tag admin"
  mutations:
    - "pauseMassSend(id)    ADMIN  MassSend!  @tag admin"
    - "resumeMassSend(id)   ADMIN  MassSend!  @tag admin"

errors: []      # failures are recorded on the notification; there is no caller

trigger_registry:
  rows: 32
  buyer: "1-13   purchase, payment, transfer, event change, refund, reminders"
  organizer: "14-30  organization, event approval, team, payout, chargeback, digest"
  operator: "31-32  approvals queue"
  exception: "otp.login is NOT in this registry — ET-IDN-001 requests it directly"
  mass: [7, 8]
  scheduled: [12, 13, 30]

rules:
  coalescing: "one purchase = one message; key reservationId, window PT30S"
  mass_send:  "rated job, 100/s, batched 500, resumable from lastProcessedId"
  rate_cap:   "10 OPTIONAL messages per user per rolling hour; transactional exempt"
  reminders:  "scheduled rows per ticket; follow reschedule, deleted on cancel/refund/transfer"
  digest:     "organizer sales activity daily; exceptional facts immediate; no empty digest"
  recipient:  "resolved at SEND time from identity_users — never from the event payload"

config:
  notification.coalesce-window: PT30S
  notification.mass-send-rate: "100/second"
  notification.mass-send-batch: 500
  notification.per-user-hourly-cap: 10
  notification.digest-hour: "08:00 organization timezone"
  notification.reminder.offsets: [PT24H, PT1H]

# ---- executable predicate: run verbatim by the verify stage ----
verify:
  - mvn -q -f backend/identity-service test -Dgroups=ET-NTF-002 -DfailIfNoTests=true
  - mvn -q -f backend verify -Dgroups=ET-NTF-002 -DfailIfNoTests=true
  - ../docker-resources/apollo-router/ticketing/compose-supergraph.sh --static

risks:
  - "The registry names module events from three services — TransferInitiatedEvent, PayoutApprovedEvent, ChargebackReceivedEvent, OrganizationSubmittedEvent, EventSubmittedEvent — as triggers, but module events do not cross service boundaries. identity-service cannot listen to booking's or catalog's module events, so every one of those rows needs a corresponding bus event that ET-PLT-003's 19-row registry does not contain. Roughly a third of the trigger registry is currently untriggerable."
  - "R2's coalescing waits 30 seconds for two events, which means a buyer's ticket confirmation is delayed by up to 30 seconds after a successful payment. In a market where people retry when they do not see confirmation, a 30-second silence after paying is exactly the window in which a second payment attempt happens."
  - "Row 30's organizer digest is category MARKETING, which ET-NTF-001 makes opt-in by default. An organizer who never opts in receives no sales digest at all, which is almost certainly not intended — a sales digest is operational information, not marketing, and the category assignment is wrong."
  - "R4's rate cap uses a Redis counter described as 'not a business record', but R4 also requires dropped messages to be recorded as SUPPRESSED with reason RATE_CAPPED. The suppression record is a business record derived from a cache that may be evicted, so the cap and the record can disagree."
  - "Reminders are per ticket, so an event with 10,000 tickets creates 20,000 reminder rows, all with scheduledFor within the same minute. The dispatch sweep claims due rows every minute and will find 20,000 at once, which is a mass send with no rate limit — R3's rating applies to mass sends but reminders are not modelled as one."
  - "R5 deletes the sender's reminders and creates the recipient's on a transfer claim, but ET-TKT-004's claim is a booking-service transaction while reminders live in identity-service. The two cannot be transactional together, so a claim that succeeds and a reminder update that fails leaves the previous owner reminded about a ticket they no longer hold."
  - "R7 resolves the recipient at send time from identity_users, which is correct, but combined with the 30-second coalesce window and the mass-send job's hours-long runtime it means a message can be addressed to whoever holds the ticket at an arbitrary later moment. For a cancellation mass send that is right; for a transfer notification addressed to the sender it may not be."
  - "Resolved: identity_mass_sends is a row of the ET-PLT-002 §4 registry."
