id: ET-FIN-001
title: Per-event escrow, the chart of accounts and double-entry
status: approved
area: FIN
service: booking-service
subgraph: booking
owner: lazarous
created: 2026-07-30
priority: must
wave: 3
blocked_by: [ET-PLT-002, ET-PLT-003, ET-PLT-005, ET-PLT-006, ET-TKT-001, ET-CAT-001]
conformance: "V3 §3.1 account types · V3 §3.2 fund flow · V3 §11 transaction tracking · V3 §13 account classification"
sources:
  - specs/CONVENTIONS.md
  - specs/ROADMAP.md
  - specs/_platform/002-persistence-baseline/spec.md
  - specs/_platform/005-error-contract/spec.md
  - specs/_platform/006-test-harness/spec.md
  - specs/ticketing/001-reservation-and-hold/spec.md
  - specs/catalog/001-event-lifecycle/spec.md
  - docs/ARCHITECTURE_REDESIGN_V3_COMPLETE.md

persistence:
  collections:
    - booking_escrow_accounts
    - booking_escrow_transactions
    - booking_platform_accounts
    - booking_chart_of_accounts
    - booking_journal_entries
    - booking_journal_lines
  indexes:
    - "booking_escrow_accounts {eventId} unique"
    - "booking_platform_accounts {accountType} unique   # three singletons"
    - "booking_journal_entries {referenceType,referenceId} compound"
    - "booking_journal_lines {journalEntryId} single"
    - "booking_journal_lines {accountCode,postedAt} compound   # HOT — trial balance"
    - "booking_escrow_transactions {escrowAccountId,createdAt} compound"
  redis_keys: []

events:
  module: []
  bus: []
  consumes:
    - catalog.EventPublished     # open the escrow, idempotent on eventId
    - catalog.EventCompleted     # ACTIVE -> HOLD, set holdUntil
    - catalog.EventRescheduled   # recompute holdUntil
    - catalog.EventCancelled     # begin refund-and-close (ET-FIN-004)
  topics: []

workflows:
  - "EventFinanceWorkflow   event-finance/{eventId}   booking-finance   signal-with-start per consumed fact; timer holdUntil; disputes re-checked P1D"

graphql:
  schema: backend/booking-service/src/main/resources/graphql/schema.graphqls
  queries:
    - "escrowAccount(eventId)                        ORGANIZER  EscrowAccount"
    - "myEscrowAccounts(organizationId, pagination)        ORGANIZER  EscrowAccountPage!"
    - "escrowTransactions(escrowAccountId, page)     ORGANIZER  EscrowTransactionOffsetPage!"  # O-4 2026-09-01: built. Was shipped as escrowTransactionsByAccount under hasRole(ADMIN); renamed to this name and widened to ORGANIZER, with the account located through TenantGuard first so the client-supplied id cannot reach another organization escrow
    - "platformAccounts                              FINANCE    [PlatformAccount!]!   @tag admin"
    - "chartOfAccounts                               FINANCE    [ChartAccount!]!      @tag admin"
    - "journalEntries(filter, page)                  FINANCE    JournalEntryPage!     @tag admin"
    - "trialBalance(asOf)                            FINANCE    TrialBalance!         @tag admin"  # F-003 2026-09-01: BUILT, returning [AccountBalance!]! rather than a TrialBalance wrapper — POSTED entries only, every chart account appears including untouched ones, and the net runs in each account's normal direction so a correct row is positive
  mutations:
    - "suspendEscrowAccount(id, reason)     ADMIN        EscrowAccount!  @tag admin"
    - "reactivateEscrowAccount(id, reason)  ADMIN        EscrowAccount!  @tag admin"
    - "closeEscrowAccount(id, reason)       ADMIN        EscrowAccount!  @tag admin"
    - "postManualAdjustment(input)          SUPER_ADMIN  JournalEntry!   @tag admin"
    - "transferToOperations(amount, reason) SUPER_ADMIN  PlatformAccount! @tag admin"
  extensions:
    - "booking extends Event { escrowAccount }   @tag admin"

errors:
  - ESCROW_ACCOUNT_UNKNOWN
  - ESCROW_NOT_ACTIVE
  - ESCROW_INSUFFICIENT_BALANCE
  - JOURNAL_UNBALANCED        # mapped to INTERNAL deliberately — it is a defect
  - ACCOUNT_CODE_UNKNOWN

chart_of_accounts:   # closed, seeded, codes never change meaning
  "1010": "Provider Settlement Receivable  ASSET      debit"
  "1020": "Platform Bank                   ASSET      debit"
  "2010": "Event Escrow                    LIABILITY  credit   # sub-ledgered per event"
  "2020": "Pending Commission              LIABILITY  credit   # collected, NOT earned"
  "2030": "Refunds Payable                 LIABILITY  credit"
  "4010": "Earned Revenue                  REVENUE    credit"
  "5010": "Payment Processing Fees         EXPENSE    debit"
  "5020": "Refund Processing Fees          EXPENSE    debit"
  "5030": "Chargeback Losses               EXPENSE    debit"
  "6010": "Operations                      ASSET      debit"

canonical_entries:
  ticket_sale:            "debit 1010 gross / credit 2010 net + credit 2020 commission"
  provider_fee:           "debit 5010 fee / credit 1010 fee"
  commission_recognition: "debit 2020 / credit 4010          (ET-FIN-002)"
  payout:                 "debit 2010 / credit 1020          (ET-FIN-003)"

escrow_lifecycle:
  states: [ACTIVE, HOLD, PAYOUT_ELIGIBLE, SUSPENDED, CLOSED]
  hold_period: P7D

invariants:
  - "every journal entry: sum(debits) == sum(credits), exactly"
  - "no balance is assigned — every balance is a projection of the journal"
  - "no escrow balance is ever negative"
  - "netAmount + commissionAmount == grossAmount, K0.01"
  - "sum(escrow balances) + pending commission == total unsettled liability"

config:
  finance.escrow.hold-period: P7D
  finance.ledger.rounding: "HALF_UP scale 2"
  finance.ledger.base-currency: ZMW

# ---- executable predicate: run verbatim by the verify stage ----
verify:
  - mvn -q -f backend/booking-service test -Dgroups=ET-FIN-001 -DfailIfNoTests=false
  - mvn -q -f backend verify -Dgroups=ET-FIN-001 -DfailIfNoTests=false
  - ../docker-resources/apollo-router/ticketing/compose-supergraph.sh --static

risks:
  - "R5 writes the sale journal entry inside ET-TKT-001 R7's confirmation transaction, which already carries the inventory move, N ticket inserts, the escrow update and the commission record. Adding a journal entry plus two or three lines pushes a 10-seat order past 20 documents in one MongoDB transaction on the hot path. If that proves unworkable the entry must move to an after-commit listener — at which point the ledger is eventually consistent with the tickets, and R3's balance guarantee weakens to eventual."
  - "1010 Provider Settlement Receivable is debited at confirmation, but the provider does not settle to the platform bank until T+1 or T+2. Nothing in this spec credits 1010 and debits 1020 when settlement actually arrives, so the receivable grows monotonically. ET-FIN-005 must own that entry or the trial balance is permanently wrong on the asset side."
  - "The lint rule --money forbids setBalance outside LedgerService by matching class names. Any refactor that renames LedgerService, or any new service that legitimately needs to write a projection, silently passes or fails for the wrong reason — the guard is a name match, not a capability check."
  - "R7 asserts that sum(escrow balances) + pending commission equals total unsettled liability, but that identity ignores 2030 Refunds Payable, which is also a liability holding other people's money. The stated invariant is incomplete and a test written to it would pass while refunds payable drifts."
  - "Manual adjustments require SUPER_ADMIN and a 20-character reason, and are counted as a metric. Nothing bounds their amount or requires a second approver. A single compromised SUPER_ADMIN account can post an arbitrary balanced entry moving money between escrow and revenue, and it will look exactly like a legitimate correction."
  - "EventFinanceWorkflow blocks PAYOUT_ELIGIBLE on openDisputeCount, which ChargebackWorkflow increments on receipt and decrements on close. A chargeback execution that never closes holds the event's payout indefinitely, so ET-ADM-003 must surface events held by a dispute past its outcome limit."
  - "Currency is stored on every account and line but every invariant and entry in §4 assumes a single currency. A second currency would make sum(debits) == sum(credits) meaningless across mixed lines, and nothing here forbids mixed-currency entries."
  - "Journal entries are append-only by convention and by an acceptance box, not by a database constraint. MongoDB has no append-only collection type, so the guarantee rests on nobody writing an update — which is exactly the kind of rule that survives until the first production incident where somebody needs to fix a row quickly."
