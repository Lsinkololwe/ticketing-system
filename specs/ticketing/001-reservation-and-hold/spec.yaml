id: ET-TKT-001
title: Reservation, the inventory hold, and the purchase workflow
status: approved
area: TKT
service: booking-service
subgraph: booking
owner: lazarous
created: 2026-07-30
priority: must
wave: 3
blocked_by: [ET-PLT-002, ET-PLT-003, ET-PLT-005, ET-PLT-006, ET-PLT-007, ET-PLT-015, ET-CAT-002]
conformance: "PDI Phase 2 transaction architecture · PDI Phase 7 saga state machine, as a Temporal workflow · V3 §4.1 · US-BUY-002"
sources:
  - specs/CONVENTIONS.md
  - specs/ROADMAP.md
  - specs/_platform/002-persistence-baseline/spec.md
  - specs/_platform/003-event-contract/spec.md
  - specs/_platform/006-test-harness/spec.md
  - specs/_platform/007-security-and-authorization/spec.md
  - specs/_platform/015-durable-execution/spec.md
  - specs/catalog/002-ticket-tiers-and-inventory/spec.md
  - docs/PAYMENT_DATA_INTEGRITY_IMPLEMENTATION_PLAN.md
  - docs/ARCHITECTURE_REDESIGN_V3_COMPLETE.md

persistence:
  collections:
    - booking_reservations
  indexes:
    - "booking_reservations {expiresAt} ttl (ttl + grace = PT1H10M)  # backstop, after the seat grace"
    - "booking_reservations {tierId,status} compound"
    - "booking_reservations {userId,status} compound"
    - "booking_reservations {status,expiresAt} compound          # boot adoption, recovery queue"
    - "booking_reservations {userId,tierId} PARTIAL UNIQUE where status=HELD"
  redis_keys: []

workflows:
  - type: PurchaseWorkflow
    id: "purchase/{reservationId}   # nameUUID(purchase:userId:idempotencyKey)"
    task_queue: booking-checkout
    conflict_policy: USE_EXISTING
    start: "Update-with-Start reserve"
    updates: [reserve, pay, cancel]
    signals: [paymentCallback]
    queries: [stage]
    activities: [hold, abandonHold, current, startPayment, verify, release, escalatePending, startLateRefund]
  - type: LatePaymentRefundWorkflow
    id: "late-refund/{reservationId}"
    task_queue: booking-checkout
    conflict_policy: USE_EXISTING   # reuse policy REJECT_DUPLICATE
    start: "PurchaseWorkflow.startLateRefund (LatePaymentRefundProcess.start), D-22"
    signals: [providerCallback]
    queries: [stage]
    activities: [open, submit, providerStatus, complete, fail, escalate]
    timers:
      - "reserve window PT5M"
      - "expiry at expiresAt (booking.reservation.ttl PT10M)"
      - "payment polls 10 s doubling to PT5M; PT1H once escalated"
      - "seat grace PT5M after expiresAt"
      - "escalation at booking.payment.max-pending PT30M"
      - "give-up P7D"
    adoption: PurchaseAdoptionRunner

events:
  bus:
    - booking.TicketPurchased      # v1, staged in the confirmation transaction → catalog (sold counters), identity (notify)
  topics:
    - booking-events

graphql:
  schema: backend/booking-service/src/main/resources/graphql/schema.graphqls
  queries:
    - "reservation(id)           AUTHENTICATED  Reservation"
    - "myActiveReservations      AUTHENTICATED  [Reservation!]!  # bounded <= 20"
  mutations:
    - "reserveTickets(input)     CUSTOMER  Reservation!   # idempotencyKey required; Update-with-Start"
    - "cancelReservation(id)     CUSTOMER  Reservation!"
  # confirmPurchase is NOT a client mutation — confirmation is the verified payment outcome inside the workflow

errors:
  - RESERVATION_UNKNOWN
  - RESERVATION_EXPIRED
  - RESERVATION_STATE_INVALID
  - PURCHASE_LIMIT_EXCEEDED
  # TIER_SOLD_OUT, TIER_NOT_ON_SALE, IDEMPOTENCY_KEY_REUSED raised here, owned elsewhere

state_machine:
  states: [HELD, CONFIRMED, EXPIRED, RELEASED, FAILED]
  transitions: 7
  pairs_tested: 30
  terminal: [CONFIRMED, EXPIRED, RELEASED, FAILED]

release_paths:   # every one a compare-and-set out of HELD; any may repeat or race
  - confirmation (verified success)
  - cancelReservation (before payment, or administrative)
  - the workflow's expiry timer
  - the seat grace, with a payment still pending
  - TTL index (backstop; deletes only reservations long terminal, frees nothing)

config:
  booking.reservation.ttl: PT10M
  booking.reservation.ttl-grace: PT1H
  booking.payment.max-pending: PT30M

# ---- executable predicate: run verbatim by the verify stage ----
verify:
  - mvn -q -f backend/booking-service test -Dgroups=ET-TKT-001 -DfailIfNoTests=false
  - mvn -q -f backend verify -Dgroups=ET-TKT-001 -DfailIfNoTests=false
  - ../docker-resources/apollo-router/ticketing/compose-supergraph.sh --static

risks:
  - "The partial unique index on {userId, tierId} where status=HELD conflicts with R5's requirement that a second reserveTickets RETURN the existing reservation. The index makes the second insert throw DuplicateKeyException, which ET-PLT-005 R7 maps to RESOURCE_CONFLICT (retryable) — not to returning the original. The two behaviours must be reconciled in the service, and the natural implementation returns a retryable error to a buyer who should simply see their existing hold."
  - "R7 requires confirmation to write tickets, credit escrow AND record commission in one MongoDB transaction. For a 10-ticket order that is 10 ticket inserts, an escrow update, two journal documents and a commission record — 14+ documents in one transaction, on the hot path, at on-sale rates. MongoDB transactions have a 60-second default limit and degrade under contention; nothing here bounds order size against that."
  - "The reservation spans one event but potentially many tiers, and R1 requires taking every tier's inventory in one transaction. Each tier is a separate findAndModify against a separate hot document, so a multi-tier order serialises across several of the platform's most contended documents and holds a transaction open while doing it."
  - "Checkout depends on the Temporal Service: with it unreachable, reserveTickets cannot start a purchase and refuses rather than holding seats with no timer. Running holds keep their state and resume when it returns, but at the D-16 on-sale rate (about 83 starts a second) the Temporal database is on the hot path and its high availability is a checkout requirement, not an operations nicety."
  - "R8 escalates a payment PENDING past 30 minutes rather than calling it failed, and releases the seats at expiry plus the seat grace. A provider that answers late therefore produces PAID_AFTER_EXPIRY refunds rather than tickets; the rate of those is the cost of never holding a tier hostage, and ET-ADM-003 must surface it."
  - "booking.TicketPurchased is staged into booking_outbox inside the confirmation transaction, through the same reactive session, so the ticket and the event commit together or neither does. The remaining exposure is the drain, not the write: a staged row that the drain cannot send stays PENDING and is retried, so catalog's sold counter lags rather than diverging. R7 must state the lag the platform accepts."
  - "Reservations quote from booking_tier_inventory's mirrored price. If ET-CAT-002's mirror is stale, every reservation in that window quotes and charges the wrong price, and the buyer is charged what the reservation says — so a stale mirror is a pricing error the platform commits to before anyone notices."
  - "A change to PurchaseWorkflowImpl that adds, removes or reorders a timer or an activity breaks replay for purchases already running. Purchases last minutes, so pinning executions to their starting build (Worker Versioning) or a version patch is required before the first such change reaches production; the replay test catches it in CI but does not make it safe to deploy."
