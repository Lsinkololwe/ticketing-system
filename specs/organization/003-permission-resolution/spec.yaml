id: ET-ORG-003
title: Permission resolution and event access grants
status: draft
area: ORG
service: identity-service
subgraph: identity
owner: lazarous
created: 2026-07-30
priority: must
wave: 1
blocked_by: [ET-PLT-003, ET-PLT-005, ET-PLT-007, ET-ORG-002]
conformance: "US Part I §1–§3 role hierarchies · US Part II §11 event access CRUD · US Part IV §22 permission resolution algorithm"
sources:
  - specs/CONVENTIONS.md
  - specs/ROADMAP.md
  - specs/_platform/003-event-contract/spec.md
  - specs/_platform/005-error-contract/spec.md
  - specs/_platform/007-security-and-authorization/spec.md
  - specs/organization/001-organizer-onboarding/spec.md
  - specs/organization/002-teams-and-invitations/spec.md
  - docs/USER_STORIES.md

persistence:
  collections:
    - identity_event_access_grants
    - identity_permissions        # reference data, seeded from §4, read-only at runtime
    - identity_role_permissions   # reference data, seeded from §4, read-only at runtime
  indexes:
    - "identity_event_access_grants {userId,eventId} unique"
    - "identity_event_access_grants {eventId,status} compound"
    - "identity_event_access_grants {organizationId} single"
  redis_keys:
    - "perm:{userId}:{permission}:{resourceType}:{resourceId}  STRING  30 s  — allows AND denies; authority is the resolver"

events:
  module: []
  bus:
    - identity.EventAccessGranted    # v1, session eventId → booking
    - identity.EventAccessRevoked    # v1, session eventId → booking
  topics:
    - identity-events

graphql:
  schema: backend/identity-service/src/main/resources/graphql/schema.graphqls
  queries:
    - "myEventAccess(eventId)                    AUTHENTICATED  EventAccessGrant"
    - "myEventAccessGrants                       AUTHENTICATED  [EventAccessGrant!]!"
    - "eventAccessGrants(eventId, status, page)  AUTHENTICATED  EventAccessGrantPage!"
    - "userEventAccess(userId, eventId)          AUTHENTICATED  EventAccessGrant"
    - "myPermissions(organizationId)             AUTHENTICATED  [String!]!"
  mutations:
    - "grantEventAccess(input)    ORGANIZER  EventAccessGrant!"
    - "updateEventAccess(input)   ORGANIZER  EventAccessGrant!"
    - "revokeEventAccess(input)   ORGANIZER  EventAccessGrant!"

rest:
  internal:
    - "POST /api/internal/permissions/resolve       internal-read"
    - "POST /api/internal/permissions/resolve-many  internal-read"

errors:
  - ACCESS_GRANT_UNKNOWN
  - EVENT_ROLE_NOT_GRANTABLE

algorithm:
  steps:
    - "1 platform role         SUPER_ADMIN / ADMIN / FINANCE → ALLOW (audited)"
    - "2 event access grant    EXHAUSTIVE — 2a denied → DENY, 2b custom → ALLOW, 2c role set → ALLOW, 2d → DENY"
    - "3 org membership        absent or not ACTIVE → DENY"
    - "4 member denied         → DENY"
    - "5 member custom or role set → ALLOW"
    - "6 default               → DENY"
  decision_steps: [PLATFORM_ROLE, GRANT_DENIED, GRANT_CUSTOM, GRANT_ROLE, GRANT_EXHAUSTIVE,
                   NOT_A_MEMBER, MEMBER_DENIED, MEMBER_CUSTOM, MEMBER_ROLE, DEFAULT]

permissions:   # 30, closed, {resource}:{action}, no wildcard
  - event:view
  - event:create
  - event:edit
  - event:publish
  - event:delete
  - event:cancel
  - event:access:grant
  - attendee:view
  - ticket:scan
  - ticket:refund
  - analytics:view
  - promotion:manage
  - financial:view
  - payout:request
  - payout:approve
  - bank:manage
  - team:invite
  - team:remove
  - team:role
  - team:view
  - organization:view
  - organization:edit
  - organization:billing
  - organization:transfer
  - organization:delete
  - organization:suspend
  - organization:approve
  - platform:configure
  - transaction:recover
  - audit:view

platform_role_sets:
  SUPER_ADMIN: "every catalogue permission"
  ADMIN:       "everything except platform:configure"
  FINANCE:     [financial:view, payout:approve, ticket:refund, transaction:recover,
                audit:view, organization:view, event:view]
  ORGANIZER:   []      # access comes entirely from membership
  CUSTOMER:    []

event_roles:
  EVENT_OWNER: [event:view, event:edit, event:publish, event:cancel, event:delete,
                attendee:view, ticket:scan, ticket:refund, analytics:view, event:access:grant]
  EVENT_ADMIN: "EVENT_OWNER minus event:cancel, event:delete"
  EDITOR:      [event:view, event:edit, attendee:view, ticket:scan, analytics:view]
  CHECK_IN:    [event:view, attendee:view, ticket:scan]
  VIEWER:      [event:view, analytics:view]

# ---- executable predicate: run verbatim by the verify stage ----
verify:
  - ./scripts/spec-lint.sh specs/organization/003-permission-resolution
  - ./scripts/spec-lint.sh --security
  - ./scripts/spec-lint.sh --events
  - ./scripts/spec-lint.sh --clock
  - mvn -q -f backend test -Dgroups=ET-ORG-003
  - mvn -q -f backend verify -Dgroups=ET-ORG-003
  - ../docker-resources/apollo-router/ticketing/compose-supergraph.sh --static

risks:
  - "Step 2d makes a grant exhaustive, which is what lets a grant restrict — and it is also the single most surprising rule in the platform. Granting ticket:scan to an organization MANAGER so they can help at the gate silently removes their ability to edit that event. The rule is correct and deliberate, but every UI that offers 'grant access' must present it as 'replace this person's access for this event', or organizers will lock their own staff out."
  - "R1 requires catalog and booking to deny when the resolver is unreachable. identity-service therefore becomes a hard dependency of every gated operation in the platform: an identity outage stops event publishing, payout approval and ticket scanning. The 30-second cache softens a blip but not an outage, and no degraded mode is specified."
  - "The resolver is on the path of every ticket scan at a gate. R7 targets p99 under 20 ms warm, but a venue with poor connectivity is exactly where scanning happens and exactly where an HTTP call to identity-service will not meet it. ET-TKT-003's offline scanning has to resolve authorisation some other way, and that other way is a second implementation of the thing R1 says must exist only once."
  - "financial:view for MANAGER and payout:request for ADMIN are per-organization settings, so the effective set is not a pure function of the role. The Redis cache key does not include the organization's settings version, so flipping either setting leaves stale allows for up to 30 seconds — acceptable — but ET-ORG-002's test asserting 'each role's effective set equals the table' is simply false for any organization that has changed one."
  - "identity_permissions and identity_role_permissions are seeded reference data that must agree with the Java enum and the §4 tables. Three representations of one model, and only a seeding test keeps them aligned; drift is invisible because runtime reads the enum, not the collections."
  - "R4 audits every step-1 allow, which means an ADMIN browsing the platform console generates an audit row per permission check per resource per page. At a page of fifty events with three checks each that is 150 rows per page view, and ET-PLT-009 has no retention policy yet."
  - "resolveMany returns a map keyed on the check, but the cache is keyed per-permission-per-resource. A batch of fifty checks is one HTTP call and fifty cache operations, which is better than fifty HTTP calls but is not the 'one cache round trip' R7 claims unless the implementation uses MGET — which the acceptance criterion does not require."
  - "Removing a member revokes their grants in the same transaction (ET-ORG-002 R6), but grants are per event and a member of a large organization may hold hundreds. A single transaction updating hundreds of documents at removal time is a long-running write on a path a user is waiting on."
