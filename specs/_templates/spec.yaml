id: ET-XXX-000
title: <one line, what the system will do>
status: draft            # draft | approved | in-progress | implemented | verified | deferred | withdrawn
area: XXX                # PLT IDN ORG CAT TKT PAY FIN NTF ADM
service: <catalog|booking|identity|api-gateway|shared-library>-service
subgraph: <catalog|booking|identity|null>
owner: lazarous
created: 2026-07-30
priority: must           # must | should | could
wave: 0                  # build wave from ROADMAP.md
blocked_by: []           # other ET- ids that must reach `implemented` first
conformance: null        # external stop this spec satisfies, e.g. "V3 §10 · PDI Phase 7"
sources:
  - specs/CONVENTIONS.md

# ---- the contract, mirrored from spec.md §4 so scripts need not parse markdown ----
persistence:
  collections: []        # each must be a row of the ET-PLT-002 §4 collection registry
  indexes: []
  redis_keys: []         # each with a TTL — Redis never holds business state

workflows: []            # each a row of the ET-PLT-015 §4 registry: type, id, queue, conflict policy, timers
schedules: []            # Temporal Schedules: id, workflow started, cadence (UTC), overlap SKIP

events:
  module: []             # always empty — a step within a service is a workflow activity, never an in-memory event
  bus: []                # cross-service wire names this spec PUBLISHES, e.g. booking.TicketPurchased
  consumes: []           # cross-service wire names this spec SUBSCRIBES to
  topics: []             # catalog-events | booking-events | identity-events
  # bus and consumes are directional and lint checks the closure: every name under
  # consumes: must appear under bus: in some spec, or the subscriber waits on a
  # message nobody sends.

graphql:
  schema: null           # backend/<svc>/src/main/resources/graphql/schema.graphqls
  queries: []
  mutations: []

errors: []               # codes introduced here; each must land in ET-PLT-005 §4

# ---- executable predicate: run verbatim by the verify stage ----
verify:
  - mvn -q -f backend/<module> test -Dgroups=<ET-ID> -DfailIfNoTests=false

risks: []
