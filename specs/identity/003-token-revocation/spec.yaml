id: ET-IDN-003
title: Token revocation — cutting a live session before its token expires
status: implemented
area: IDN
service: identity-service
subgraph: identity
owner: lazarous
created: 2026-08-17
priority: must
wave: 1
blocked_by: [ET-PLT-002, ET-PLT-003, ET-PLT-005, ET-PLT-007]
conformance: "OWASP ASVS 3.3 session termination · PDI Phase 5"
sources:
  - specs/CONVENTIONS.md
  - specs/ROADMAP.md
  - specs/_platform/007-security-and-authorization/spec.md
  - specs/identity/002-keycloak-user-sync/spec.md
  - specs/identity/004-accounts-and-contacts/spec.md

persistence:
  collections:
    - identity_token_revocations
  indexes:
    - "identity_token_revocations {_id} unique  — _id is derived from type+value, so no second unique index is needed"
    - "identity_token_revocations {expiresAt} ttl 0"
    - "identity_token_revocations {revokedAt} single  — the administrator's revocation log (activeRevocations)"
  redis_keys:
    - "pml:blacklist:{jti}              STRING  token exp+skew (max lifespan+skew)  — authority identity_token_revocations"
    - "pml:session:{sid}                STRING  lifespan+skew  — authority identity_token_revocations"
    - "pml:revoked:{sub}                STRING  lifespan+skew  — authority identity_token_revocations"
    - "pml:revocation:cache-complete    STRING  10 min, renewed every 2 min  — cache-completeness marker; absent means untrusted"

events:
  module: []   # a step within a service is a workflow activity (ET-PLT-015)
  bus: []      # a revocation is the MongoDB record plus the shared Redis key; no domain event (amended 2026-10-11)
  consumes: []
  topics: []

graphql:
  schema: backend/identity-service/src/main/resources/graphql/schema.graphqls
  queries:
    - "activeRevocations(type, pagination)  ADMIN @tag(admin)  RevocationRecordOffsetPage!"
    - "mySessions                           authenticated      [AccountSession!]!   # the sessions list"
  mutations:
    - "revokeToken(jti, reason)             ADMIN @tag(admin)  RevocationRecord!"
    - "revokeSessionAccess(sid, reason)     ADMIN @tag(admin)  RevocationRecord!"
    - "revokeUserAccess(userId, reason)     ADMIN @tag(admin)  RevocationRecord!"
    - "signOutEverywhere                    authenticated      Int!   # the caller's other sessions"
    - "revokeSession(sessionId)             authenticated      Boolean!   # one of the caller's own sessions"

errors:
  - TOKEN_REVOKED
  - REVOCATION_UNAVAILABLE

internal_api:
  - "POST   /api/internal/revocations/check            durable check for an untrusted cache"
  - "POST   /api/internal/revocations                  one revocation by type and value"
  - "POST   /api/internal/revocations/logout           a sign-out's token, session and user"
  - "DELETE /api/internal/revocations/{type}/{value}   lifts one revocation"

revocation_types:
  TOKEN:   "jti — one access token"
  SESSION: "sid — every token of one Keycloak SSO session"
  USER:    "sub — every token one subject holds"

triggers:
  - LOGOUT
  - CREDENTIAL_CHANGE
  - MEMBER_REMOVED
  - GRANT_REVOKED
  - ORGANIZATION_SUSPENDED
  - ACCOUNT_ERASED
  - ADMIN_REVOKE
  - SUSPECTED_COMPROMISE
  - CONTACT_CHANGED     # added 2026-10-04 (F-044)
  - ACCOUNT_SUSPENDED   # added 2026-10-04, D-47
  # Keycloak LOGOUT / REFRESH_TOKEN_ERROR reach identity-service through the user-sync listener
  # (POST /api/internal/keycloak/sync/event, field `sid`) and are recorded as a SESSION revocation
  # with reason keycloak-logout / keycloak-refresh-token-error; no new trigger value.

eviction_policy:
  # Every revocation key carries a TTL, so a volatile-* policy can evict it as readily as allkeys-*.
  # The probe therefore treats any evicting policy as untrusted when maxmemory is set.
  trusted:   [noeviction, "any policy with no maxmemory limit"]
  untrusted: ["any evicting policy (allkeys-*, volatile-*) with maxmemory set"]

config:
  pml.security.revocation.enabled: true
  pml.security.revocation.access-token-lifespan: PT5M   # amended 2026-10-04 (was PT1H)
  pml.security.revocation.clock-skew: PT60S
  pml.security.revocation.cache-timeout: PT0.25S
  pml.security.revocation.durable-timeout: PT2S          # must exceed cache-timeout
  pml.security.revocation.require-eviction-safe-cache: true
  pml.security.revocation.cache-completeness-ttl: PT10M  # at least twice cache-warm-interval
  pml.security.revocation.cache-warm-interval: PT2M

# ---- executable predicate: run verbatim by the verify stage ----
verify:
  - mvn -q -f backend/identity-service test -Dgroups=ET-IDN-003 -DfailIfNoTests=false
  - mvn -q -f backend/shared-library test -Dgroups=ET-IDN-003 -DfailIfNoTests=false
  - mvn -q -f backend verify -Dgroups=ET-IDN-003 -DfailIfNoTests=false
  - ../docker-resources/apollo-router/ticketing/compose-supergraph.sh --static

risks:
  - "The check is on the hot path of every authenticated request in the platform. A 5 ms p99 budget is met only while the cache is warm and trusted; under an untrusted policy every sensitive check goes to the durable store and the budget is gone. The untrusted path needs its own latency figure, which this spec does not give."
  - "A USER revocation must cover tokens minted AFTER the revocation, which means Keycloak can still issue a valid token for a banned subject and the platform refuses it only at use. Until ET-IDN-002 disables the Keycloak user in the same operation, ban is enforced downstream rather than at the source."
  - "Fail-closed depends on the sensitive-operation list in §4 being complete. It is enumerated by hand across nine specs, and a money-moving mutation added later without the marking degrades silently to fail-open — the failure is invisible until someone tests it."
  - "The TTL index removes rows on MongoDB's own schedule, roughly once a minute and imprecisely. A USER revocation whose row is swept slightly early reopens access for the remainder of the skew window. The clock-skew margin absorbs this only if it exceeds the sweep imprecision."
  - "Identity re-warms the whole live revocation set on an interval. At the target scale of ET-PLT-011 the set is small, but a mass revocation — suspending a large organization — makes one reload proportional to its membership."
  - "A USER revocation refuses every token of that subject for a full window, so revoking an event grant or removing a member signs the person out of every organization they belong to for up to six minutes. The alternative, cutting only the sessions that used the grant, needs the grant to be a claim on the token, which it is not."
