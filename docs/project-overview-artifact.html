e imports",description:"A Maven module all backend services depend on. Home of the JWT/role plumbing, common DTOs, GraphQL scalars, and tenant isolation checks — so security behaves identically in every service.",owns:[{name:"KeycloakJwtAuthenticationConverter",note:"extracts ROLE_* / SCOPE_* authorities from JWTs"},{name:"MultiIssuerJwtResolver",note:"multi-realm token validation (new)"},{name:"TenantValidationService",note:"enforces organization-level isolation"},{name:"Common DTOs & GraphQL scalars",note:"pagination, errors, DateTime, BigDecimal, JSON, UUID"},{name:"auth.graphqls",note:"shared @auth directive schema"}],services:[],notable:[]},{id:"keycloak-ext",name:"Keycloak Extensions",port:":8084 (inside Keycloak)",tagline:"Custom SPIs deployed into the identity provider",description:"A fat JAR of custom Keycloak plugins. The star is the Phone OTP authenticator: passwordless login where the code arrives on WhatsApp or SMS — the preferred channel in Zambia. An event listener keeps MongoDB user profiles in sync with Keycloak.",owns:[{name:"PhoneOtpAuthenticator",note:"passwordless login; calls identity-service to send/verify 6-digit codes"},{name:"UserSyncEventListener",note:"pushes Keycloak user events (register, update, delete) to identity-service"},{name:"AccountTypeRoleMapper",note:"maps account_type claim → CUSTOMER / ORGANIZER / ADMIN roles"},{name:"FreeMarker templates",note:"phone-otp-input.ftl / phone-otp-verify.ftl login screens"}],services:[],notable:["Deployed by dropping the JAR into /opt/keycloak/providers/","Realm: event-ticketing · clients for admin, mobile & internal service-to-service"]}],c=[{id:"admin-web",label:"Admin Web",sub:"Next.js · :3030",tier:"client",detail:"Platform administration: approve organizers/events/documents, analytics, finance (escrow, payouts, refunds), user management, audit logs."},{id:"org-admin",label:"Organization Admin",sub:"Next.js",tier:"client",detail:"Organizer dashboard: apply to become an organizer, create & ma
