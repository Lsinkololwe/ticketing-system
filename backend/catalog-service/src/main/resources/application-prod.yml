# =====================================================================
# PROD profile  —  every external dependency comes from the environment.
# Secrets are never in this file: RabbitMQ and the rest are read from the environment's secret
# store, over TLS, with a least-privilege user per service.
# =====================================================================
spring:
  # Self-hosted Temporal: the platform's own Temporal frontend and namespace.
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS}
      enable-https: ${TEMPORAL_TLS_ENABLED:false}
    namespace: ${TEMPORAL_NAMESPACE:ticketing}
  cloud:
    azure:
      credential:
        managed-identity-enabled: ${AZURE_MANAGED_IDENTITY_ENABLED:true}
        client-id: ${AZURE_CLIENT_ID:}
      keyvault:
        secret:
          enabled: ${AZURE_KEYVAULT_ENABLED:true}
          endpoint: ${AZURE_KEYVAULT_ENDPOINT:}
  # RabbitMQ over TLS. Host, virtual host and credentials come from the environment's secret store
  # and have no defaults; a missing value stops startup naming the property.
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    ssl:
      enabled: true
      verify-hostname: true
