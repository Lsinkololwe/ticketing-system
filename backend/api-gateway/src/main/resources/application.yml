server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 8KB
  netty:
    max-initial-line-length: 8192

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 60s
  http:
    codecs:
      max-in-memory-size: 10MB

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            pool:
              type: elastic
              max-connections: 1000
              acquire-timeout: 1000
              max-idle-time: 30s
            connect-timeout: 5000
            response-timeout: 30s
          trusted-proxies: "127\\.0\\.0\\.1|10\\..*|172\\.(1[6-9]|2[0-9]|3[0-1])\\..*|192\\.168\\..*"
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:3030"
                  - "http://localhost:3003"
                  - "http://localhost:5173"
                  - "${FRONTEND_URL:http://localhost:3000}"
                allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: graphql-federation
              uri: ${APOLLO_ROUTER_URL:http://localhost:4000}
              predicates:
                - Path=/graphql
              filters:
                - RewritePath=/graphql, /
                - name: CircuitBreaker
                  args:
                    name: apolloRouterCircuitBreaker
                    fallbackUri: forward:/fallback/graphql
                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    methods: POST
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 500ms
                      factor: 2
            - id: identity-rest
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/organizations/**, /api/v1/documents/**
            - id: catalog-media-rest
              uri: ${CATALOG_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/media/**
            - id: payment-webhooks
              uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/webhooks/payment/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@ipKeyResolver}"
            - id: keycloak-realm
              uri: ${KEYCLOAK_URL:http://localhost:8084}
              predicates:
                - Path=/realms/myticketzm/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: keycloakCircuitBreaker
                    fallbackUri: forward:/fallback/identity
            - id: keycloak-resources
              uri: ${KEYCLOAK_URL:http://localhost:8084}
              predicates:
                - Path=/resources/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: keycloakCircuitBreaker
            - id: oauth2-legacy
              uri: ${KEYCLOAK_URL:http://localhost:8084}
              predicates:
                - Path=/oauth2/**
              filters:
                - RewritePath=/oauth2/(?<segment>.*), /realms/myticketzm/protocol/openid-connect/$\{segment}
                - name: CircuitBreaker
                  args:
                    name: keycloakCircuitBreaker
                    fallbackUri: forward:/fallback/identity
            - id: wellknown-legacy
              uri: ${KEYCLOAK_URL:http://localhost:8084}
              predicates:
                - Path=/.well-known/openid-configuration
              filters:
                - RewritePath=/.well-known/openid-configuration, /realms/myticketzm/.well-known/openid-configuration
                - name: CircuitBreaker
                  args:
                    name: keycloakCircuitBreaker
          # NOTE: RequestRateLimiter removed from default-filters because it causes
          # UnsupportedOperationException when adding headers to already-committed
          # streaming responses (like GraphQL). Apply rate limiting per-route instead.
          default-filters: []

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      # The gateway's own service-account token, used only to ask identity-service whether a
      # token is revoked when the Redis cache cannot answer for certain.
      client:
        registration:
          api-gateway:
            client-id: ${API_GATEWAY_CLIENT_ID:myticketzm-api-gateway}
            # No default: an unset secret must fail at start-up naming the variable.
            client-secret: ${API_GATEWAY_SECRET}
            authorization-grant-type: client_credentials
            scope: internal-read
        provider:
          api-gateway:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8084/realms/myticketzm/protocol/openid-connect/token}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8084/realms/myticketzm}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8084/realms/myticketzm/protocol/openid-connect/certs}

keycloak:
  client-id: ${API_GATEWAY_CLIENT_ID:myticketzm-api-gateway}
  # Platform-admin realm split. The default below is NOT empty: the admin realm is trusted
  # out of the box, and tokens from both realms are validated per their `iss` claim.
  trusted-issuers: ${KEYCLOAK_TRUSTED_ISSUERS:http://localhost:8084/realms/myticketzm-admin}
  # Every client in both realms carries an oidc-audience-mapper naming the gateway
  # (docker-resources/keycloak/*.json) — buyer, staff and every service-to-service client alike,
  # so the platform has one audience, not one per service. Without the mapper Keycloak omits
  # `aud` entirely rather than defaulting it to anything, so this value and that mapper are one
  # change: set one without the other and every token is rejected.
  expected-audiences: ${KEYCLOAK_EXPECTED_AUDIENCES:${API_GATEWAY_CLIENT_ID:myticketzm-api-gateway}}
  # How long a fetched signing-key set is trusted before it is fetched again (ISO-8601, 0 < ttl <= PT15M;
  # anything else stops startup). A token carrying a kid not in the cached set triggers one refetch
  # regardless, so a rotation is visible before this elapses; a key withdrawn from the realm
  # stays trusted at most this long.
  jwks-cache-ttl: ${KEYCLOAK_JWKS_CACHE_TTL:PT5M}

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8083}

# Every authenticated request is checked against the revocation records identity-service owns:
# first the shared Redis cache, then identity's internal API. A revoked token is refused with
# 401; when neither store answers, reads proceed and state-changing requests get a 503.
pml:
  security:
    revocation:
      enabled: ${REVOCATION_ENABLED:true}
      identity-url: ${services.identity.url}
      # Tracks the realm's accessTokenLifespan (300 s in the ticketing realms).
      access-token-lifespan: ${ACCESS_TOKEN_LIFESPAN:5m}
      clock-skew: 60s
      cache-timeout: 250ms
      durable-timeout: 2s
      require-eviction-safe-cache: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50
    instances:
      apolloRouterCircuitBreaker:
        baseConfig: default
        failureRateThreshold: 30
        slowCallDurationThreshold: 5s
      keycloakCircuitBreaker:
        baseConfig: default
      # Guards the Redis revocation cache: while open, checks skip Redis and ask identity directly.
      revocationCache:
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 250ms
        minimumNumberOfCalls: 10
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
    instances:
      apolloRouterCircuitBreaker:
        timeoutDuration: 45s
      keycloakCircuitBreaker:
        timeoutDuration: 15s
      revocationCache:
        timeoutDuration: 250ms
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    group:
      liveness:
        include: livenessState,ping
      readiness:
        include: readinessState,circuitBreakers
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.pml.gateway: DEBUG
    io.github.resilience4j: INFO
    # Spring Security debugging - set to INFO to disable
    # Core security
    org.springframework.security: TRACE
    # WebFlux reactive security (WebFilterChainProxy, filters)
    org.springframework.security.web.server: TRACE
    org.springframework.security.web.server.WebFilterChainProxy: TRACE
    org.springframework.security.web.server.MatcherSecurityWebFilterChain: TRACE
    org.springframework.security.web.server.authorization: TRACE
    org.springframework.security.web.server.authentication: TRACE
    org.springframework.security.web.server.context: TRACE
    # OAuth2 Resource Server / JWT
    org.springframework.security.oauth2: TRACE
    org.springframework.security.oauth2.server.resource: TRACE
    org.springframework.security.oauth2.jwt: TRACE
    # Authentication
    org.springframework.security.authentication: TRACE
    org.springframework.security.authorization: TRACE
    # Security config
    org.springframework.security.config: TRACE
    org.springframework.security.config.web.server: TRACE
    # Reactor context propagation
    reactor.netty.http.server: DEBUG
    # Custom security debug filter
    com.pml.shared.security: TRACE

security:
  debug:
    enabled: ${SECURITY_DEBUG_ENABLED:false}

gateway:
  security:
    max-request-size: 10485760
    max-graphql-size: 1048576
    max-upload-size: 52428800
    max-uri-length: 8192
    max-header-size: 8192
    auth-rate-limit:
      enabled: true
      max-attempts: 5
      window-seconds: 300
      lockout-seconds: 900
