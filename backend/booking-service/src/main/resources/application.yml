server:
  port: 8082
  shutdown: graceful

spring:

  # The scheduler pool.
  #
  # Booking's timers, sweeps and reconciliation jobs run as Temporal workflows and Schedules,
  # so the only scheduled task on this pool is the outbox drain, which polls every
  # 2 seconds and must never wait behind anything else. The pool stays sized above one so a slow
  # drain cycle cannot starve a future job that joins it.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:10}
  profiles:
    # Defaults to "local" (Service Bus emulator). Prod sets SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: booking-service
  lifecycle:
    timeout-per-shutdown-phase: 60s

  # Durable execution. The task queues this service's workers poll; TemporalRegistryLintTest
  # checks them against the platform's list of queues.
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:127.0.0.1:7233}
    namespace: ${TEMPORAL_NAMESPACE:ticketing}
    workers-auto-discovery:
      packages:
        - com.pml.booking.workflow
    workers:
      - task-queue: booking-checkout
        capacity:
          max-concurrent-activity-executors: ${TEMPORAL_ACTIVITY_EXECUTORS:50}
      - task-queue: booking-provider
        capacity:
          max-concurrent-activity-executors: 16
      - task-queue: booking-finance
      - task-queue: booking-recon
        capacity:
          max-concurrent-activity-executors: 2

  cloud:
    azure:
      keyvault:
        secret:
          enabled: ${AZURE_KEYVAULT_ENABLED:false}
          endpoint: ${AZURE_KEYVAULT_ENDPOINT:}
          property-source-enabled: true
          refresh-interval: ${AZURE_KEYVAULT_REFRESH_INTERVAL:3600000}
      credential:
        managed-identity-enabled: ${AZURE_MANAGED_IDENTITY_ENABLED:false}
        client-id: ${AZURE_CLIENT_ID:}
        client-secret: ${AZURE_CLIENT_SECRET:}
        tenant-id: ${AZURE_TENANT_ID:}
      servicebus:
        connection-string: ${azure-servicebus-connection-string:${AZURE_SERVICEBUS_CONNECTION_STRING:}}
        # No `namespace` key on purpose. An empty one is still "set": it overrides the connection string and sends the
        # producer to ".servicebus.windows.net", where every send times out. Managed-identity deployments set
        # SPRING_CLOUD_AZURE_SERVICEBUS_NAMESPACE in the environment instead.
        retry:
          mode: exponential
          max-retries: 3
          delay: 1s
          max-delay: 30s
          try-timeout: 60s
        producer:
          send-timeout: 30s
        consumer:
          prefetch-count: 10
          max-concurrent-calls: 5
          auto-complete: false
          max-auto-lock-renew-duration: 5m
    stream:
      default-binder: servicebus
      function:
        definition: catalogEventConsumer
      bindings:
        # The binding the outbox drain publishes on, through EventBridge.
        bookingEvents-out-0:
          destination: booking-events
        catalogEventConsumer-in-0:
          destination: catalog-events
          # The subscription name. booking-sub is the one the broker defines with sessions required, so a
          # tier's capacity change cannot overtake the tier's creation.
          group: booking-sub
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 10000
            back-off-multiplier: 2.0
            default-retryable: true
      servicebus:
        bindings:
          catalogEventConsumer-in-0:
            consumer:
              entity-type: topic
              checkpoint-mode: RECORD
              auto-complete: false
              prefetch-count: 10
              max-concurrent-calls: 5
              max-auto-lock-renew-duration: 5m
              sub-queue: none
              receive-mode: peek-lock
              session-enabled: true
          bookingEvents-out-0:
            producer:
              entity-type: topic
              # The binder sends asynchronously unless told otherwise: send() then returns true before the
              # bus has accepted anything and a later failure is only logged, so the outbox would mark the
              # event sent and lose it. Synchronous sends raise on failure, which keeps the row pending.
              sync: true

  data:
    mongodb:
      # No directConnection: it tells the driver to treat the server as a single node, so it
      # never discovers the replica set — and multi-document transactions become silently inert.
      # The compose file runs mongod --replSet rs0 with rs.initiate(), so the services connect to
      # it as a replica set.
      # No default: the local profile pins the development database, so any other profile that
      # forgets the variable stops at startup naming it instead of dialling a password in git.
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:dev_ticketing}
      # Indexes come only from the service's *IndexInitializer registry; annotations on the models create none.
      auto-index-creation: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  graphql:
    path: /graphql
    graphiql:
      # A debug surface defaults OFF and is switched on deliberately. Every profile inherits this
      # base file and application-prod.yml does not override it, so OFF here is what production
      # gets; only application-local.yml turns it on.
      #
      # The page itself is served unauthenticated, but executing a query and introspecting the
      # schema both go through /graphql, which IS authenticated.
      enabled: ${GRAPHIQL_ENABLED:false}
      path: /graphiql
    websocket:
      path: /graphql
      connection-init-timeout: 60s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8084/realms/myticketzm}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8084/realms/myticketzm/protocol/openid-connect/certs}
      client:
        registration:
          booking-service:
            client-id: ${BOOKING_SERVICE_CLIENT_ID:myticketzm-booking-service}
            # No default. Unset in prod must FAIL naming the variable, not start
            # against Keycloak with a credential readable in git.
            client-secret: ${BOOKING_SERVICE_SECRET}
            authorization-grant-type: client_credentials
            scope: internal-read,internal-write
        provider:
          booking-service:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8084/realms/myticketzm/protocol/openid-connect/token}

security:
  debug:
    enabled: ${SECURITY_DEBUG_ENABLED:false}

dgs:
  graphql:
    schema-locations: classpath*:graphql/**/*.graphql*
    # Disable DGS's built-in DateTime/Date/Time scalars (OffsetDateTime-backed,
    # cannot serialize Instant). Replaced by com.pml.shared.graphql.DateTimeScalar.
    extensions:
      scalars:
        time-dates:
          enabled: false

keycloak:
  client-id: ${BOOKING_SERVICE_CLIENT_ID:myticketzm-booking-service}
  # Platform-admin realm split. The default below is NOT empty: the admin realm is trusted
  # out of the box, and tokens from both realms are validated per their `iss` claim.
  trusted-issuers: ${KEYCLOAK_TRUSTED_ISSUERS:http://localhost:8084/realms/myticketzm-admin}
  # Every client in both realms carries an oidc-audience-mapper naming the gateway
  # (docker-resources/keycloak/*.json) — buyer, staff and every service-to-service client alike,
  # so the platform has one audience, not one per service. Without the mapper Keycloak omits
  # `aud` entirely rather than defaulting it to anything, so this value and that mapper are one
  # change: set one without the other and every token is rejected.
  expected-audiences: ${KEYCLOAK_EXPECTED_AUDIENCES:${API_GATEWAY_CLIENT_ID:myticketzm-api-gateway}}
  # How long a fetched signing-key set is trusted before it is fetched again (ISO-8601, 0 < ttl <= PT15M;
  # anything else stops startup). A token carrying a kid not in the cached set triggers one refetch
  # regardless, so a rotation is visible before this elapses; a key withdrawn from the realm
  # stays trusted at most this long.
  jwks-cache-ttl: ${KEYCLOAK_JWKS_CACHE_TTL:PT5M}

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8085}
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,caches
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    group:
      liveness:
        include: livenessState,ping
      readiness:
        include: readinessState,mongo,redis
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      service: booking

logging:
  level:
    root: INFO
    com.pml.booking: DEBUG
    # Spring Security debugging - set to INFO to disable
    # Core security
    org.springframework.security: TRACE
    # WebFlux reactive security (WebFilterChainProxy, filters)
    org.springframework.security.web.server: TRACE
    org.springframework.security.web.server.WebFilterChainProxy: TRACE
    org.springframework.security.web.server.MatcherSecurityWebFilterChain: TRACE
    org.springframework.security.web.server.authorization: TRACE
    org.springframework.security.web.server.authentication: TRACE
    org.springframework.security.web.server.context: TRACE
    # OAuth2 Resource Server / JWT
    org.springframework.security.oauth2: TRACE
    org.springframework.security.oauth2.server.resource: TRACE
    org.springframework.security.oauth2.jwt: TRACE
    # Authentication
    org.springframework.security.authentication: TRACE
    org.springframework.security.authorization: TRACE
    # Security config
    org.springframework.security.config: TRACE
    org.springframework.security.config.web.server: TRACE
    # Reactor context propagation
    reactor.netty.http.server: DEBUG
    # Custom security debug filter
    com.pml.shared.security: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

graphql:
  security:
    enabled: true
    max-depth: ${GRAPHQL_MAX_DEPTH:10}
    max-complexity: ${GRAPHQL_MAX_COMPLEXITY:200}
    log-rejected-queries: ${GRAPHQL_LOG_REJECTED:true}
    depth-exceeded-message: "Query depth limit exceeded"
    complexity-exceeded-message: "Query complexity limit exceeded"

booking:
  # How long a checkout holds its seats. Ten minutes is a trade, not a round number: mobile-money
  # confirmation has a long tail (handset off, subscriber in a meeting, PIN
  # mistyped twice). Two minutes releases inventory while people are still
  # paying; thirty lets a hundred abandoned checkouts strangle a hot tier.
  reservation:
    ttl-minutes: 10

  # Data migrations (see DataMigrationRunner).
  #
  # Enabled by default because the alternative — a service running against
  # unmigrated data — fails at read time, in front of buyers, rather than at
  # startup. fail-fast aborts the boot if one errors: half-converted data
  # cannot be read, and refusing to start is far easier to notice than
  # serving errors.
  migrations:
    enabled: ${BOOKING_MIGRATIONS_ENABLED:true}
    fail-fast: ${BOOKING_MIGRATIONS_FAIL_FAST:true}

  payment:
    # How long a payment intent stays payable once created.
    timeout: PT15M

pawapay:
  api:
    url: ${PAWAPAY_API_URL:https://api.sandbox.pawapay.io}
    token: ${pawapay-api-token:${PAWAPAY_API_TOKEN:}}
    version: v2
    connect-timeout: 10s
    read-timeout: 30s
  webhook:
    verify-signature: ${PAWAPAY_VERIFY_SIGNATURE:false}
    public-key-id: ${pawapay-webhook-key-id:${PAWAPAY_WEBHOOK_KEY_ID:}}
    public-key: ${pawapay-webhook-public-key:${PAWAPAY_WEBHOOK_PUBLIC_KEY:}}
    signature-max-age: 5m
    supported-digest-algorithms: [sha-256, sha-512]
    supported-signature-algorithms: [ecdsa-p256-sha256, rsa-pss-sha512]
    ip-allowlist-enabled: ${PAWAPAY_IP_ALLOWLIST_ENABLED:false}
    allowed-ips:
      - "${PAWAPAY_WEBHOOK_IP_1:}"
      - "${PAWAPAY_WEBHOOK_IP_2:}"
      - "${PAWAPAY_WEBHOOK_IP_3:}"
    allowed-cidrs:
      - "${PAWAPAY_WEBHOOK_CIDR_1:}"
      - "${PAWAPAY_WEBHOOK_CIDR_2:}"
  providers:
    mtn:
      code: MTN_MOMO_ZMB
      display-name: MTN Mobile Money
      prefixes: ["26097", "26096"]
      enabled: true
    airtel:
      code: AIRTEL_ZMB
      display-name: Airtel Money
      prefixes: ["26077", "26076"]
      enabled: true
    zamtel:
      code: ZAMTEL_ZMB
      display-name: Zamtel Kwacha
      prefixes: ["26095"]
      enabled: true

payment:
  escrow:
    minimum-payout-amount: 10.00
  refund:
    cutoff-hours-before-event: 24
    allow-post-event-refund: false
    require-approval: true
    processing-fee-rate: 0
  gateway:
    primary-providers:
      MTN: pawapay
      AIRTEL: pawapay
      ZAMTEL: pawapay
    fallback:
      enabled: true

platform:
  # PawaPay calls these without a token; each callback's signature is verified instead.
  security:
    public-paths: [/api/webhooks/payment/**]
  # Finance staff approve payouts, refunds and reconciliation across every organization, so in
  # booking they read organization-owned records platform-wide, as administrators do.
  tenancy:
    platform-wide-authorities: [ROLE_ADMIN, ROLE_SUPER_ADMIN, ROLE_FINANCE]
    # Memberships come from identity-service, which owns them.
    identity-url: ${services.identity.url}
  # The transactional outbox. Payment outcomes and ticket purchases stage their
  # envelopes here inside the business transaction; the drain publishes them on bookingEvents-out-0.
  outbox:
    collection: booking_outbox
    binding: bookingEvents-out-0
    drain-interval: PT2S
  # The consumer retry budget, stated rather than defaulted.
  # Spring Cloud Stream has a default for each of these, which is how a service
  # can look configured while retrying a dead provider ten times a second or
  # giving up after a single attempt. ConsumerRetryLintTest fails the build if
  # any goes missing. Three attempts over roughly two seconds: long enough to
  # ride out a driver reconnect, short enough that a genuinely broken consumer
  # reaches its dead letter while an operator is still looking at the alert.
  # Exhaustion dead-letters with a reason, it does not rethrow.
  events:
    consumer:
      max-attempts: ${EVENT_CONSUMER_MAX_ATTEMPTS:3}
      initial-backoff: ${EVENT_CONSUMER_INITIAL_BACKOFF:500ms}
      max-backoff: ${EVENT_CONSUMER_MAX_BACKOFF:10s}
      backoff-multiplier: ${EVENT_CONSUMER_BACKOFF_MULTIPLIER:2.0}
  commission:
    rate: ${PLATFORM_COMMISSION_RATE:0.05}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
        ignoreExceptions:
          - com.pml.booking.exception.BusinessValidationException
    instances:
      # Guards the Redis revocation cache: while open, checks skip Redis and ask identity directly.
      revocationCache:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 250ms
        minimum-number-of-calls: 10
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      catalogService:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 20s
      pawaPayService:
        baseConfig: default
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 5
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignoreExceptions:
          - com.pml.booking.exception.BusinessValidationException
    instances:
      catalogService:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 1s
      pawaPayService:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 2s
        exponentialBackoffMultiplier: 2.5
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
        cancelRunningFuture: true
    instances:
      revocationCache:
        timeout-duration: 250ms
        cancel-running-future: true
      catalogService:
        baseConfig: default
        timeoutDuration: 15s
      pawaPayService:
        baseConfig: default
        timeoutDuration: 30s

notification:
  enabled: true
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
    from: ${NOTIFICATION_EMAIL_FROM:noreply@pml-events.com}
    admin-recipients: ${NOTIFICATION_ADMIN_EMAILS:finance@pml-events.com}
  slack:
    enabled: ${NOTIFICATION_SLACK_ENABLED:false}
    webhook-url: ${SLACK_WEBHOOK_URL:}
    channel: ${SLACK_CHANNEL:#finance-alerts}
  sms:
    enabled: ${NOTIFICATION_SMS_ENABLED:false}
    provider-url: ${SMS_PROVIDER_URL:}
    api-key: ${SMS_API_KEY:}
    on-call-numbers: ${SMS_ON_CALL_NUMBERS:}

mongodb:
  schema-validation:
    enabled: ${MONGODB_SCHEMA_VALIDATION_ENABLED:true}
    validation-action: ${MONGODB_VALIDATION_ACTION:ERROR}
    validation-level: ${MONGODB_VALIDATION_LEVEL:STRICT}
    fail-on-validation-error: ${MONGODB_VALIDATION_FAIL_ON_ERROR:true}
    schema-base-path: ${MONGODB_SCHEMA_BASE_PATH:mongodb/schemas}
    operation-timeout-ms: ${MONGODB_SCHEMA_TIMEOUT_MS:30000}

# ==============================================================================
# TOKEN REVOCATION
# ==============================================================================
# Every authenticated request is checked against the revocation records identity-service owns:
# first the shared Redis cache, then identity's internal API. A revoked token is refused with
# TOKEN_REVOKED. When neither answers, ordinary requests proceed and operations marked
# @FailClosedOnRevocation are refused with REVOCATION_UNAVAILABLE.
pml:
  security:
    revocation:
      enabled: ${REVOCATION_ENABLED:true}
      identity-url: ${services.identity.url}
      # Tracks the realm's accessTokenLifespan (myticketzm-realm.json: 300).
      access-token-lifespan: ${ACCESS_TOKEN_LIFESPAN:5m}
      clock-skew: 60s
      cache-timeout: 250ms
      durable-timeout: 2s
      require-eviction-safe-cache: true
