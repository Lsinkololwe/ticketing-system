# Local Development Configuration
# This file contains development-only settings and should NOT be used in production

# ============================================================================
# SECURITY CONFIGURATION (DEVELOPMENT ONLY)
# ============================================================================
# WARNING: This encryption key is for DEVELOPMENT ONLY.
# DO NOT use this key in production.
#
# For production:
# 1. Generate a new key: FieldEncryptionService.generateKey()
# 2. Store in AWS KMS, Azure Key Vault, or HashiCorp Vault
# 3. Load via environment variable: APP_SECURITY_ENCRYPTION_KEY
# ============================================================================
app:
  security:
    encryption:
      # DEVELOPMENT KEY ONLY - Generated via FieldEncryptionService.generateKey()
      # Base64-encoded 256-bit AES key
      # Replace with production key in production environments
      key: "4BL5P9rsrnVX9NOYJ3V9CoZbrInkrA+3hwju49qFl98="

# ============================================================================
# AZURE SERVICE BUS — local EMULATOR (docker-resources, host port 5673)
# ----------------------------------------------------------------------------
# Well-known Microsoft emulator connection string (NOT a real credential):
# UseDevelopmentEmulator=true disables TLS + auth and only targets localhost.
# Swap to real Azure with SPRING_PROFILES_ACTIVE=prod (managed identity).
# ============================================================================
spring:
  cloud:
    azure:
      servicebus:
        namespace: ""
        connection-string: "Endpoint=sb://localhost:5672;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    stream:
      default-binder: servicebus

spring:
  security:
    oauth2:
      client:
        registration:
          identity-service:
            client-secret: ${IDENTITY_SERVICE_SECRET:identity-service-secret}

# ---------------------------------------------------------------------------
# ET-PLT-001 R6 · credentials for local development
#
# Deliberately NOT defaulted here. The real values live in the sibling repo,
# already gitignored, and are the same variables the realm import substitutes:
#
#   docker-resources/.env.ticketing   IDENTITY_SERVICE_SECRET, CATALOG_SERVICE_SECRET,
#                                     BOOKING_SERVICE_SECRET, API_GATEWAY_SECRET
