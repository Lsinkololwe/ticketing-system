server:
  port: 8083
  shutdown: graceful

spring:

  # The scheduler pool. Spring's default is ONE thread. The outbox drain, polling
  # every 2 seconds, is this service's only @Scheduled job: timers, reminders and the Keycloak
  # group-mirror repair run in Temporal. The pool stays sized so a drain pass never
  # waits on another job that joins it.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}
  profiles:
    # Defaults to "local" (Service Bus emulator). Prod sets SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: identity-service
  # Outgoing mail for email codes. SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD supply the server; the
  # timeouts bound every SMTP step to 5 s (identity.delivery.email.timeout bounds the whole send).
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 60s
  reactor:
    context-propagation: auto

  # Durable execution. The task queues this service's workers poll; TemporalRegistryLintTest
  # checks them against the platform's list of queues.
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:127.0.0.1:7233}
    namespace: ${TEMPORAL_NAMESPACE:ticketing}
    workers-auto-discovery:
      packages:
        - com.pml.identity.workflow
    workers:
      - task-queue: identity-onboarding
        capacity:
          max-concurrent-activity-executors: ${TEMPORAL_ACTIVITY_EXECUTORS:50}
      - task-queue: identity-notify
      - task-queue: identity-account

  cloud:
    azure:
      servicebus:
        connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}
        # No `namespace` key on purpose. An empty one is still "set": it overrides the connection string and sends the
        # producer to ".servicebus.windows.net", where every send times out. Managed-identity deployments set
        # SPRING_CLOUD_AZURE_SERVICEBUS_NAMESPACE in the environment instead.
        producer:
          send-timeout: 30s
    stream:
      default-binder: servicebus
      function:
        definition: ""
      bindings:
        # The one binding identity publishes on, through the outbox drain.
        identityEvents-out-0:
          destination: identity-events
      # The Azure binder needs the entity kind spelled out for a producer; without it every send
      # fails with "Entity type cannot be null" and the outbox never drains.
      servicebus:
        bindings:
          identityEvents-out-0:
            producer:
              entity-type: topic
              # The binder sends asynchronously unless told otherwise: send() then returns true before the
              # bus has accepted anything and a later failure is only logged, so the outbox would mark the
              # event sent and lose it. Synchronous sends raise on failure, which keeps the row pending.
              sync: true

  data:
    mongodb:
      # No directConnection: it tells the driver to treat the server as a single node, so it
      # never discovers the replica set — and multi-document transactions become silently inert.
      # The compose file runs mongod --replSet rs0 with rs.initiate(), so the services connect to
      # it as a replica set.
      # No default: the local profile pins the development database, so any other profile that
      # forgets the variable stops at startup naming it instead of dialling a password in git.
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:dev_ticketing}
      # Indexes come only from the service's *IndexInitializer registry; annotations on the models create none.
      auto-index-creation: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  graphql:
    graphiql:
      # A debug surface defaults OFF and is switched on deliberately. Every profile inherits this
      # base file and application-prod.yml does not override it, so OFF here is what production
      # gets; only application-local.yml turns it on.
      #
      # The page itself is served unauthenticated, but executing a query and introspecting the
      # schema both go through /graphql, which IS authenticated.
      enabled: ${GRAPHIQL_ENABLED:false}
    path: /graphql
    websocket:
      path: /graphql
      connection-init-timeout: 60s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8084/realms/myticketzm}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8084/realms/myticketzm/protocol/openid-connect/certs}
      client:
        registration:
          identity-service:
            client-id: ${IDENTITY_SERVICE_CLIENT_ID:myticketzm-identity-service}
            # No default. Unset in prod must FAIL naming the variable,
            # not start against Keycloak with a credential anyone can read in git.
            client-secret: ${IDENTITY_SERVICE_SECRET}
            authorization-grant-type: client_credentials
            scope: internal-read,internal-write
        provider:
          identity-service:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8084/realms/myticketzm/protocol/openid-connect/token}

security:
  debug:
    enabled: ${SECURITY_DEBUG_ENABLED:false}

dgs:
  graphql:
    schema-locations: classpath*:graphql/**/*.graphql*
    schema-json:
      enabled: false
    introspection:
      enabled: true
    # Disable DGS's built-in DateTime/Date/Time scalars (OffsetDateTime-backed,
    # cannot serialize Instant). Replaced by com.pml.shared.graphql.DateTimeScalar.
    extensions:
      scalars:
        time-dates:
          enabled: false

keycloak:
  server-url: ${KEYCLOAK_URL:http://localhost:8084}
  realm: ${KEYCLOAK_REALM:myticketzm}
  admin-username: ${KEYCLOAK_ADMIN_USER:admin}
  # No default: an unset password fails at start-up instead of trying "admin".
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}
  admin-realm: master
  client-id: ${IDENTITY_SERVICE_CLIENT_ID:myticketzm-identity-service}
  client-secret: ${IDENTITY_SERVICE_SECRET}
  # Platform-admin realm split. The default below is NOT empty: the admin realm is trusted
  # out of the box, and tokens from both realms are validated per their `iss` claim.
  trusted-issuers: ${KEYCLOAK_TRUSTED_ISSUERS:http://localhost:8084/realms/myticketzm-admin}
  # Every client in both realms carries an oidc-audience-mapper naming the gateway
  # (docker-resources/keycloak/*.json) — buyer, staff and every service-to-service client alike,
  # so the platform has one audience, not one per service. Without the mapper Keycloak omits
  # `aud` entirely rather than defaulting it to anything, so this value and that mapper are one
  # change: set one without the other and every token is rejected.
  expected-audiences: ${KEYCLOAK_EXPECTED_AUDIENCES:${API_GATEWAY_CLIENT_ID:myticketzm-api-gateway}}
  # How long a fetched signing-key set is trusted before it is fetched again (ISO-8601, 0 < ttl <= PT15M;
  # anything else stops startup). A token carrying a kid not in the cached set triggers one refetch
  # regardless, so a rotation is visible before this elapses; a key withdrawn from the realm
  # stays trusted at most this long.
  jwks-cache-ttl: ${KEYCLOAK_JWKS_CACHE_TTL:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    group:
      liveness:
        include: livenessState,ping
      readiness:
        include: readinessState,mongo,redis
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      service: identity

logging:
  level:
    root: INFO
    com.pml.identity: DEBUG
    # Spring Security debugging - set to INFO to disable
    # Core security
    org.springframework.security: TRACE
    # WebFlux reactive security (WebFilterChainProxy, filters)
    org.springframework.security.web.server: TRACE
    org.springframework.security.web.server.WebFilterChainProxy: TRACE
    org.springframework.security.web.server.MatcherSecurityWebFilterChain: TRACE
    org.springframework.security.web.server.authorization: TRACE
    org.springframework.security.web.server.authentication: TRACE
    org.springframework.security.web.server.context: TRACE
    # OAuth2 Resource Server / JWT
    org.springframework.security.oauth2: TRACE
    org.springframework.security.oauth2.server.resource: TRACE
    org.springframework.security.oauth2.jwt: TRACE
    # Authentication
    org.springframework.security.authentication: TRACE
    org.springframework.security.authorization: TRACE
    # Security config
    org.springframework.security.config: TRACE
    org.springframework.security.config.web.server: TRACE
    # Reactor context propagation
    reactor.netty.http.server: DEBUG
    # Custom security debug filter
    com.pml.shared.security: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

graphql:
  security:
    enabled: true
    max-depth: ${GRAPHQL_MAX_DEPTH:10}
    max-complexity: ${GRAPHQL_MAX_COMPLEXITY:200}
    log-rejected-queries: ${GRAPHQL_LOG_REJECTED:true}
    depth-exceeded-message: "Query depth limit exceeded"
    complexity-exceeded-message: "Query complexity limit exceeded"

identity:
  migrations:
    enabled: ${IDENTITY_MIGRATIONS_ENABLED:true}
    fail-fast: ${IDENTITY_MIGRATIONS_FAIL_FAST:true}
    # contacts-backfill: true counts what would be written and writes nothing.
    contacts-backfill-dry-run: ${IDENTITY_CONTACTS_BACKFILL_DRY_RUN:false}
    contacts-backfill-batch-size: ${IDENTITY_CONTACTS_BACKFILL_BATCH_SIZE:500}

  # ---------------------------------------------------------------------------
  # Buyer identity (ET-IDN-004, specs/identity/004-accounts-and-contacts/CONTRACT.md 7).
  #
  # The secrets below have EMPTY defaults on purpose: IdentityConfigurationValidator stops
  # startup naming the property when one is blank, except in profiles local and test, which
  # carry development values in application-local.yml and src/test/resources/application-test.yml.
  # ---------------------------------------------------------------------------
  challenge:
    code-length: 6
    ttl: PT5M
    max-attempts: 5
    lock: PT15M
    cooldown: PT60S
    hmac-pepper: ${IDENTITY_CHALLENGE_HMAC_PEPPER:}
  proof:
    ttl: PT2M
    ensure-hold: PT30M
  login-handle:
    ttl: PT60S
  contact:
    # HMAC key of the contact key (uniqueness, Redis keys, workflow ids). Changing it orphans every
    # stored valueHash. The AES key for valueEncrypted is app.security.encryption.key.
    hash-key: ${IDENTITY_CONTACT_HASH_KEY:}
    encryption-key-id: ${IDENTITY_CONTACT_ENCRYPTION_KEY_ID:v1}
    # A released contact cannot be claimed by another account for this long (decision F-044, 2026-10-04)
    quarantine: ${IDENTITY_CONTACT_QUARANTINE:P30D}
    # a code may be asked for again this long after it was sent (user decision 2026-10-04)
    resend-after: ${IDENTITY_CONTACT_RESEND_AFTER:PT5M}
  id-hash:
    key: ${IDENTITY_ID_HASH_KEY:}
  limits:
    contact-codes-per-day: 10
    ip-codes-per-hour: 10
    device-distinct-contacts-per-day: 5
    country-codes-per-day:
      default: 2000
    allowed-countries: [ZM, GB, US, ZA, ZW, MW, TZ, KE, BW, NA, AE, CA, AU, IE, DE, FR, NL]
  delivery:
    whatsapp:
      enabled: ${IDENTITY_DELIVERY_WHATSAPP_ENABLED:false}
      api-url: ${IDENTITY_DELIVERY_WHATSAPP_API_URL:https://graph.facebook.com/v21.0}
      phone-number-id: ${IDENTITY_DELIVERY_WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${IDENTITY_DELIVERY_WHATSAPP_ACCESS_TOKEN:}
      template-name: ${IDENTITY_DELIVERY_WHATSAPP_TEMPLATE:}
      template-language: ${IDENTITY_DELIVERY_WHATSAPP_TEMPLATE_LANGUAGE:en}
      timeout: PT5S
    email:
      enabled: ${IDENTITY_DELIVERY_EMAIL_ENABLED:false}
      from: ${IDENTITY_DELIVERY_EMAIL_FROM:}
      timeout: PT5S
    capture:
      # In-memory capture of sent messages for tests. Profiles local and test only; startup fails elsewhere.
      enabled: false
  # Exact browser origins allowed to call this service cross-origin; no wildcard, no default.
  cors:
    allowed-origins: ${IDENTITY_CORS_ALLOWED_ORIGINS:}
  account:
    # How long /accounts/ensure waits for the account workflow before answering PROVISIONING (202).
    ensure-wait: PT5S

messaging:
  whatsapp:
    api-url: https://graph.facebook.com/v17.0
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}

mongodb:
  schema-validation:
    enabled: ${MONGODB_SCHEMA_VALIDATION_ENABLED:true}
    validation-action: ${MONGODB_VALIDATION_ACTION:ERROR}
    validation-level: ${MONGODB_VALIDATION_LEVEL:STRICT}
    fail-on-validation-error: ${MONGODB_VALIDATION_FAIL_ON_ERROR:true}
    schema-base-path: ${MONGODB_SCHEMA_BASE_PATH:mongodb/schemas}
    operation-timeout-ms: ${MONGODB_SCHEMA_TIMEOUT_MS:30000}

resilience4j:
  circuitbreaker:
    instances:
      keycloak:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        record-exceptions:
          - jakarta.ws.rs.ProcessingException
          - jakarta.ws.rs.WebApplicationException
          - java.util.concurrent.TimeoutException
      # Guards the Redis revocation cache. While open, checks skip Redis and resolve
      # against MongoDB directly rather than waiting out a connection timeout each.
      revocationCache:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 250ms
        minimum-number-of-calls: 10
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      keycloak:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - jakarta.ws.rs.ProcessingException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      # Set well below spring.data.redis.timeout (2s) so a slow cache hands over to the
      # durable store instead of adding latency to every authenticated request.
      revocationCache:
        timeout-duration: 250ms
        cancel-running-future: true

# ==============================================================================
# TOKEN REVOCATION
# ==============================================================================
# Redis caches the MongoDB system of record. Checks resolve against either store, so a
# Redis outage costs latency rather than enforcement. Operations annotated
# @FailClosedOnRevocation are refused when neither store can answer.
pml:
  security:
    revocation:
      enabled: ${REVOCATION_ENABLED:true}
      # Tracks the realm's accessTokenLifespan (myticketzm-realm.json: 300) so a
      # revocation record outlives every token it revokes.
      access-token-lifespan: ${ACCESS_TOKEN_LIFESPAN:5m}
      clock-skew: 60s
      cache-timeout: 250ms
      durable-timeout: 2s
      require-eviction-safe-cache: true

file-upload:
  presigned-url:
    default-expiry-minutes: 60

# Where verification documents are stored: local (development) or s3. Exactly one
# FileStorageService is active, chosen by this one key.
file-storage:
  type: ${FILE_STORAGE_TYPE:local}
  local:
    base-path: ${FILE_STORAGE_LOCAL_PATH:./uploads}

aws:
  s3:
    region: ${AWS_REGION:us-east-1}
    bucket:
      verification-documents: ${AWS_S3_BUCKET_VERIFICATION_DOCS:ticketing-verification-docs}

app:
  security:
    encryption:
      # AES-256 key for payout and bank details, base64. No default: a service started without
      # APP_SECURITY_ENCRYPTION_KEY stops at startup instead of encrypting with a key in git.
      # Only the local profile (application-local.yml) carries a development key.
      key: ${APP_SECURITY_ENCRYPTION_KEY}

# ---------------------------------------------------------------------------
# The consumer retry budget, stated rather than defaulted
#
# Spring Cloud Stream has a default for every one of these, which is how a
# service can look configured while retrying a dead provider ten times a second
# or giving up after a single attempt. They are set explicitly, and
# ConsumerRetryLintTest fails the build if any goes missing.
#
# Three attempts over roughly two seconds: long enough to ride out a driver
# reconnect, short enough that a genuinely broken consumer reaches its dead
# letter while an operator is still looking at the alert. Exhaustion
# dead-letters with a reason (DeadLetter), it does not rethrow.
platform:
  events:
    consumer:
      max-attempts: ${EVENT_CONSUMER_MAX_ATTEMPTS:3}
      initial-backoff: ${EVENT_CONSUMER_INITIAL_BACKOFF:500ms}
      max-backoff: ${EVENT_CONSUMER_MAX_BACKOFF:10s}
      backoff-multiplier: ${EVENT_CONSUMER_BACKOFF_MULTIPLIER:2.0}

  # The transactional outbox.
  #
  # No defaults come from the auto-configuration, deliberately: a guessed collection would give a
  # misconfigured service a working outbox pointed somewhere no drain looks — messages staged where
  # nothing reads them, which is the failure the outbox exists to prevent, reached another way.
  outbox:
    collection: identity_outbox
    # The binding identity publishes on (spring.cloud.stream.bindings above). A name
    # that is not declared there has no destination, and the drain's sends would never reach the topic.
    binding: identityEvents-out-0
    # Two seconds: the drain is a poll, and this is how long a staged message waits before the bus
    # sees it. Short enough that nothing feels queued, long enough that an idle service is not
    # querying constantly.
    drain-interval: PT2S

