# =============================================================================
# TEMPORAL GATES (ET-PLT-015)
# =============================================================================
# Runs the durable-execution gates on any change to backend code or the spec:
#   - TemporalRegistryLintTest   task queues / workflow interfaces match spec §4
#   - WorkflowDeterminismLintTest workflow code is deterministic, payloads carry ids only
#   - SpecStatusLintTest / SpecTagCoverageTest  a spec's status is backed by gates and tagged tests
#   - every *Workflow*Test (layer 3, TestWorkflowEnvironment + WorkflowReplayer replay tests)
# No Docker or secrets needed: these tests run in-process. Layer-2 Testcontainers tests are not run here.
# Verified locally: mvn test -pl shared-library,catalog-service,booking-service,identity-service
#   -Dtest='TemporalRegistryLintTest,WorkflowDeterminismLintTest,SpecStatusLintTest,SpecTagCoverageTest,*Workflow*Test'
#   (about 175 tests, 3 minutes).
# =============================================================================

name: Temporal gates

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'specs/_platform/015-durable-execution/**'
      - '.github/workflows/temporal.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'specs/_platform/015-durable-execution/**'
      - '.github/workflows/temporal.yml'

permissions:
  contents: read

concurrency:
  group: temporal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lints and workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      - name: Temporal gates
        working-directory: backend
        run: >
          mvn -B -ntp test
          -pl shared-library,catalog-service,booking-service,identity-service
          -Dtest='TemporalRegistryLintTest,WorkflowDeterminismLintTest,SpecStatusLintTest,SpecTagCoverageTest,*Workflow*Test'
          -Dsurefire.failIfNoSpecifiedTests=false
          -DfailIfNoTests=false

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/*/target/surefire-reports
          retention-days: 7
